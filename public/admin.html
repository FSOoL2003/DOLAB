<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم · دولاب</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#141210">
<link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Cormorant+Garamond:wght@600&display=swap">
<style>
:root {
  --bg: #FAF8F5; --surface: #FFFFFF; --tile: #F3F1EE; --fg: #141210; --muted: #77716A; --line: #E8E4DE;
  --gold: #A6813A; --gold-soft: #F6F0E4; --btn: #141210; --btn-fg: #FFFFFF; --danger: #A3242F; --ok: #2F6B4F;
  --shadow: 0 24px 60px rgba(20, 18, 16, .18);
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --f-mark: "Cormorant Garamond", "Didot", "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F0E0D; --surface: #161513; --tile: #1F1D1A; --fg: #F2EEE7; --muted: #A39C92; --line: #2D2A26;
    --gold: #D2B06C; --gold-soft: #2A2419; --btn: #F2EEE7; --btn-fg: #141210; --danger: #EE7C84; --ok: #7CC4A0;
    --shadow: 0 24px 60px rgba(0, 0, 0, .55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F0E0D; --surface: #161513; --tile: #1F1D1A; --fg: #F2EEE7; --muted: #A39C92; --line: #2D2A26;
  --gold: #D2B06C; --gold-soft: #2A2419; --btn: #F2EEE7; --btn-fg: #141210; --danger: #EE7C84; --ok: #7CC4A0;
  --shadow: 0 24px 60px rgba(0, 0, 0, .55); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14.5px; line-height: 1.6; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 1.5px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; }
.num { font-variant-numeric: tabular-nums; }

header.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 12px; }
.logo { font-family: var(--f-mark); font-weight: 600; font-size: 22px; letter-spacing: .3em; direction: ltr; text-decoration: none; }
.crumb { color: var(--gold); font-size: 13px; letter-spacing: .08em; font-weight: 500; }
.spacer { flex: 1; }
.who { color: var(--muted); font-size: 13px; }

.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 8px 18px; border-radius: 999px; font-weight: 500; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease; }
.btn:hover { border-color: var(--fg); }
.btn.primary:hover { transform: translateY(-1px); box-shadow: 0 10px 26px -8px rgba(166, 129, 58, .55); }
.btn.primary { background: var(--btn); color: var(--btn-fg); border-color: var(--btn); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
.btn.danger:hover { border-color: var(--danger); }
.btn.sm { padding: 5px 12px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

nav.tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--line); margin-top: 22px; overflow-x: auto; }
nav.tabs button { border: 0; background: none; padding: 10px 0; color: var(--muted); font-size: 15px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--gold); font-weight: 500; }
section.panel { padding-block: 24px 64px; display: grid; gap: 22px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); padding: 16px 18px; display: grid; gap: 2px; }
.kpi .lbl { color: var(--muted); font-size: 12.5px; }
.kpi .val { font-size: 30px; font-weight: 300; line-height: 1.25; }
.kpi .sub { color: var(--muted); font-size: 12px; }
.kpi .sub b { color: var(--ok); font-weight: 500; }

.card { background: var(--surface); border: 1px solid var(--line); padding: 18px 20px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin-bottom: 14px; }
.card h2 { margin: 0; font-size: 16px; font-weight: 500; }
.card .hint { color: var(--muted); font-size: 12.5px; margin: 2px 0 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 22px; }

.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.seg button + button { border-inline-start: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-fg); }

/* bar chart */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 230px; direction: ltr; overflow: visible; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); font-variant-numeric: tabular-nums; }
.chart .bar { fill: var(--gold); transition: opacity .15s; }
.chart.hovering .bar { opacity: .35; }
.chart.hovering .bar.on { opacity: 1; }
.chart .hit { fill: transparent; }
.tip { position: absolute; pointer-events: none; background: var(--btn); color: var(--btn-fg); font-size: 12.5px; padding: 6px 10px; white-space: nowrap; transform: translate(-50%, -100%); margin-top: -8px; box-shadow: var(--shadow); z-index: 2; }
.tip b { font-weight: 600; font-variant-numeric: tabular-nums; }
details.data { margin-top: 10px; font-size: 13px; }
details.data summary { cursor: pointer; color: var(--muted); }

/* horizontal bars */
.hbars { display: grid; gap: 10px; }
.hbar { display: grid; grid-template-columns: minmax(70px, 30%) 1fr auto; gap: 12px; align-items: center; font-size: 13.5px; }
.hbar .track { height: 10px; background: var(--tile); border-radius: 0 4px 4px 0; overflow: hidden; }
.hbar .fill { height: 100%; background: var(--gold); border-radius: 4px 0 0 4px; min-width: 2px; }
.hbar .n { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 2ch; text-align: end; }

/* tables */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.search { border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; min-width: 0; flex: 1 1 220px; max-width: 360px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 10px 12px; text-align: start; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
th { font-weight: 500; color: var(--muted); font-size: 12.5px; background: var(--tile); position: sticky; top: 0; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--fg); }
th[aria-sort="ascending"]::after { content: " ↑"; color: var(--gold); }
th[aria-sort="descending"]::after { content: " ↓"; color: var(--gold); }
td.n, th.n { text-align: end; font-variant-numeric: tabular-nums; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--gold-soft); }
.u-name { font-weight: 500; }
.u-mail { color: var(--muted); font-size: 12.5px; direction: ltr; unicode-bidi: isolate; }
.thumb { width: 40px; height: 52px; object-fit: cover; background: var(--tile); display: block; }
.thumb.empty { display: grid; place-items: center; color: var(--muted); font-size: 11px; }
.badge { display: inline-block; font-size: 11.5px; padding: 1px 8px; border: 1px solid var(--line); color: var(--muted); }
.badge.gold { border-color: var(--gold); color: var(--gold); }
.badge.bad { border-color: var(--danger); color: var(--danger); }
.badge.ok { border-color: var(--ok); color: var(--ok); }
.row-actions { display: flex; gap: 6px; }
.empty { color: var(--muted); padding: 28px; text-align: center; }

/* user drawer */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(15, 14, 13, .55); display: flex; justify-content: flex-start; }
.drawer { background: var(--bg); width: min(760px, 100%); height: 100%; overflow-y: auto; box-shadow: var(--shadow); padding: 22px 22px 48px; display: grid; gap: 18px; align-content: start; }
.drawer-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.drawer-head h2 { margin: 0; font-size: 22px; font-weight: 400; }
.feed { display: grid; gap: 0; max-height: 340px; overflow-y: auto; }
.feed div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.feed div:last-child { border-bottom: 0; }
.feed time { color: var(--muted); white-space: nowrap; font-size: 12px; }

/* fields editor */
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); padding: 4px 6px 4px 12px; font-size: 13.5px; }
.chip i { width: 13px; height: 13px; border-radius: 50%; border: 1px solid var(--line); display: inline-block; }
.chip button { border: 0; background: none; color: var(--muted); width: 22px; height: 22px; line-height: 1; font-size: 12px; }
.chip button:hover { color: var(--danger); }
.add-row { display: flex; gap: 8px; }
.add-row input[type="text"] { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); padding: 7px 10px; }
.add-row input[type="color"] { width: 42px; height: 38px; padding: 2px; border: 1px solid var(--line); background: var(--surface); }
.savebar { position: sticky; bottom: 0; background: var(--surface); border: 1px solid var(--gold); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; box-shadow: var(--shadow); }

/* review queue */
.count-badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--danger); color: #FFF; font-size: 11.5px; font-weight: 600; margin-inline-start: 4px; vertical-align: 2px; }
.rv { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 16px; }
.rv-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: flex-start; justify-content: space-between; }
.rv-head h2 { margin: 0; font-size: 18px; font-weight: 500; }
.rv-meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.rv-facts { display: flex; flex-wrap: wrap; gap: 6px; }
.rv-facts span { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.rv-facts i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--line); display: inline-block; }
.rv-desc { margin: 0; font-size: 13.5px; white-space: pre-wrap; color: var(--fg); background: var(--tile); border-radius: 12px; padding: 10px 14px; }
.rv-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.rv-box { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; align-content: start; }
.rv-box h3 { margin: 0; font-size: 14px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.rv-photos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.rv-ph { position: relative; aspect-ratio: 3 / 4; border-radius: 10px; overflow: hidden; background: var(--tile); }
.rv-ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rv-ph a, .rv-ph button { position: absolute; bottom: 6px; inset-inline-start: 6px; background: rgba(20, 18, 16, .72); color: #FFF; border: 0; border-radius: 999px; font-size: 11px; padding: 2px 9px; text-decoration: none; cursor: pointer; }
.rv-ph .cover { position: absolute; top: 6px; inset-inline-start: 6px; background: var(--gold); color: #FFF; border-radius: 999px; font-size: 10.5px; padding: 1px 8px; }
.rv-drop { aspect-ratio: 3 / 4; border-radius: 10px; border: 1.5px dashed color-mix(in srgb, var(--muted) 55%, transparent); display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 12px; cursor: pointer; padding: 6px; transition: border-color .2s, background-color .2s; }
.rv-drop:hover, .rv-drop.drag { border-color: var(--gold); background: var(--gold-soft); color: var(--gold); }
.rv-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 14px; }
.rv-actions .grp { display: flex; flex-wrap: wrap; gap: 8px; }
.linkbtn { border: 0; background: none; color: var(--gold); font-size: 12.5px; padding: 0; text-decoration: underline; text-underline-offset: 3px; }

.gate { max-width: 460px; margin: 12vh auto; text-align: center; display: grid; gap: 14px; justify-items: center; padding: 0 16px; }
.gate h1 { font-weight: 300; margin: 0; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--btn); color: var(--btn-fg); padding: 10px 20px; font-size: 13.5px; z-index: 60; box-shadow: var(--shadow); }
@media (max-width: 600px) {
  .who { display: none; }
  .kpi .val { font-size: 25px; }
  .card { padding: 14px; }
  .hbar { grid-template-columns: minmax(64px, 34%) 1fr auto; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="/">DOLAB</a>
    <span class="crumb">لوحة التحكم</span>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <button class="btn" id="refreshBtn" type="button" hidden>تحديث</button>
    <a class="btn" href="/">الموقع</a>
  </div>
</header>

<div id="gate" class="gate" hidden></div>

<main class="wrap" id="main" hidden>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="overview" aria-selected="true">نظرة عامة</button>
    <button role="tab" data-tab="reviews" aria-selected="false">طلبات النشر <span class="count-badge" id="revCount" hidden></span></button>
    <button role="tab" data-tab="users" aria-selected="false">المستخدمون</button>
    <button role="tab" data-tab="dresses" aria-selected="false">الإعلانات</button>
    <button role="tab" data-tab="fields" aria-selected="false">الحقول</button>
  </nav>
  <section class="panel" id="tab-overview"></section>
  <section class="panel" id="tab-reviews" hidden></section>
  <section class="panel" id="tab-users" hidden></section>
  <section class="panel" id="tab-dresses" hidden></section>
  <section class="panel" id="tab-fields" hidden></section>
</main>

<div class="overlay" id="drawerOv" hidden><div class="drawer" id="drawer"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const nf = new Intl.NumberFormat("ar-SA-u-nu-latn");
  const df = new Intl.DateTimeFormat("ar-SA-u-nu-latn-ca-gregory", { day: "numeric", month: "short", year: "numeric" });
  const dshort = new Intl.DateTimeFormat("ar-SA-u-nu-latn-ca-gregory", { day: "numeric", month: "short" });
  const rtf = new Intl.RelativeTimeFormat("ar-u-nu-latn", { numeric: "auto" });
  const MODES = { rent: "إيجار", sale: "بيع", both: "إيجار وبيع" };
  const EVENTS = { view: "فتح الإعلان", whatsapp: "ضغط واتساب", copy_phone: "نسخ الرقم" };

  function h(tag, attrs, kids) {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "text") el.textContent = v;
      else if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of [].concat(kids == null ? [] : kids)) if (c != null && c !== false) el.append(c);
    return el;
  }
  const svgEl = (tag, attrs) => {
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  };
  let toastT;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2600);
  }
  function ago(ms) {
    if (!ms) return "—";
    const s = (ms - Date.now()) / 1000, a = Math.abs(s);
    if (a < 60) return "الآن";
    if (a < 3600) return rtf.format(Math.round(s / 60), "minute");
    if (a < 86400) return rtf.format(Math.round(s / 3600), "hour");
    if (a < 86400 * 30) return rtf.format(Math.round(s / 86400), "day");
    return df.format(ms);
  }
  const fmt = (n) => nf.format(n || 0);
  const pct = (a, b) => (b ? Math.round((a / b) * 1000) / 10 : 0) + "%";

  async function api(method, url, body) {
    const opts = { method, credentials: "same-origin", headers: {} };
    if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    const res = await fetch(url, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error(data.error || "http_" + res.status); e.code = data.error; e.status = res.status; throw e; }
    return data;
  }
  function fail(e) {
    if (e && e.status === 401) { showGate("انتهت الجلسة", "سجّل الدخول من جديد بحساب المشرف."); return; }
    if (e && e.code === "admin_protected") { toast("لا يمكن تطبيق هذا على حساب مشرف."); return; }
    toast("تعذّر تنفيذ الطلب، حاول مرة أخرى.");
  }

  // ---------- gate ----------
  function showGate(title, msg) {
    $("#main").hidden = true; $("#refreshBtn").hidden = true;
    $("#gate").replaceChildren(h("h1", { text: title }), h("p", { text: msg }), h("a", { class: "btn primary", href: "/", text: "الذهاب إلى الموقع وتسجيل الدخول" }));
    $("#gate").hidden = false;
  }

  // ---------- tabs ----------
  const loaded = {};
  let current = "overview";
  function showTab(name, force) {
    current = name;
    document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === name)));
    document.querySelectorAll("section.panel").forEach((s) => (s.hidden = s.id !== "tab-" + name));
    if (force || !loaded[name]) { loaded[name] = true; LOADERS[name](); }
  }
  document.querySelectorAll("nav.tabs button").forEach((b) => b.addEventListener("click", () => showTab(b.dataset.tab)));
  $("#refreshBtn").addEventListener("click", () => { for (const k in loaded) loaded[k] = false; showTab(current, true); toast("تم التحديث"); });

  const loading = (id) => $(id).replaceChildren(h("div", { class: "empty", text: "جارٍ التحميل…" }));

  // ---------- overview ----------
  const METRICS = [
    ["visitors", "الزوار"], ["views", "مشاهدات الإعلانات"], ["contacts", "التواصل"], ["signups", "التسجيلات"], ["listings", "إعلانات جديدة"]
  ];
  let metric = "visitors", stats = null;

  async function loadOverview() {
    loading("#tab-overview");
    try { stats = await api("GET", "/api/admin/stats"); } catch (e) { fail(e); return; }
    renderOverview();
  }
  function kpi(label, val, sub) {
    return h("div", { class: "kpi" }, [h("div", { class: "lbl", text: label }), h("div", { class: "val num", text: val }), sub ? h("div", { class: "sub" }, sub) : null]);
  }
  const week = (n) => [h("b", { class: "num", text: "+" + fmt(n) }), " آخر 7 أيام"];

  function renderOverview() {
    const t = stats.totals;
    const kpis = h("div", { class: "kpis" }, [
      kpi("المستخدمون", fmt(t.users), week(t.users7d)),
      kpi("الإعلانات", fmt(t.dresses), week(t.dresses7d)),
      kpi("زوار آخر 7 أيام", fmt(t.visitors7d), "إجمالي " + fmt(t.visitors) + " زائر"),
      kpi("مشاهدات الإعلانات", fmt(t.views), week(t.views7d)),
      kpi("طلبات التواصل", fmt(t.contacts), week(t.contacts7d)),
      kpi("نسبة التواصل", pct(t.contacts, t.views), "من المشاهدات إلى تواصل")
    ]);
    const split = h("div", { class: "kpis" }, [
      kpi("للإيجار", fmt(t.rent)), kpi("للبيع", fmt(t.sale)), kpi("محجوز / مُباع", fmt(t.unavailable)),
      kpi("بانتظار المراجعة", fmt(t.pending)), kpi("مخفية من الإدارة", fmt(t.hidden)), kpi("مستخدمون محظورون", fmt(t.banned))
    ]);

  function renderFields() {
    const listCard = (key, title) => {
      const input = h("input", { type: "text", maxlength: 40, placeholder: "إضافة قيمة جديدة", "aria-label": "إضافة إلى " + title });
      const add = () => {
        const v = input.value.trim();
        if (!v) return;
        if (catalog[key].includes(v)) { toast("موجودة مسبقاً"); return; }
        catalog[key].push(v); markDirty();
      };
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } });
      return h("div", { class: "card" }, [
        h("div", { class: "card-head" }, [h("h2", { text: title }), h("span", { class: "hint num", text: fmt(catalog[key].length) + " قيمة" })]),
        h("div", { class: "chips" }, catalog[key].map((v, i) => h("span", { class: "chip" }, [v, h("button", { type: "button", "aria-label": "حذف " + v, text: "✕", onclick: () => {
          if (catalog[key].length <= 1) { toast("لازم تبقى قيمة واحدة على الأقل"); return; }
          catalog[key].splice(i, 1); markDirty();
        } })]))),
        h("div", { class: "add-row" }, [input, h("button", { class: "btn", type: "button", text: "إضافة", onclick: add })])
      ]);
    };
    const cName = h("input", { type: "text", maxlength: 40, placeholder: "اسم اللون", "aria-label": "اسم اللون" });
    const cHex = h("input", { type: "color", value: "#C9A44C", "aria-label": "درجة اللون" });
    const addColor = () => {
      const name = cName.value.trim();
      if (!name) return;
      if (catalog.colors.some((c) => c.name === name)) { toast("اللون موجود مسبقاً"); return; }
      catalog.colors.push({ name, hex: cHex.value.toUpperCase() }); markDirty();
    };
    cName.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addColor(); } });
    const colors = h("div", { class: "card" }, [
      h("div", { class: "card-head" }, [h("h2", { text: "الألوان" }), h("span", { class: "hint num", text: fmt(catalog.colors.length) + " لون" })]),
      h("div", { class: "chips" }, catalog.colors.map((c, i) => h("span", { class: "chip" }, [h("i", { style: "background:" + c.hex }), c.name, h("button", { type: "button", "aria-label": "حذف " + c.name, text: "✕", onclick: () => {
        if (catalog.colors.length <= 1) { toast("لازم يبقى لون واحد على الأقل"); return; }
        catalog.colors.splice(i, 1); markDirty();
      } })]))),
      h("div", { class: "add-row" }, [cHex, cName, h("button", { class: "btn", type: "button", text: "إضافة", onclick: addColor })])
    ]);
    const save = h("button", { class: "btn primary", type: "button", text: "حفظ التغييرات", disabled: !dirty, onclick: async () => {
      save.disabled = true;
      try { catalog = (await api("PUT", "/api/admin/catalog", catalog)).catalog; dirty = false; toast("تم الحفظ، والتغييرات ظاهرة بالموقع الآن"); renderFields(); }
      catch (e) { save.disabled = false; fail(e); }
    } });
    $("#tab-fields").replaceChildren(
      h("p", { style: "margin:0;color:var(--muted);font-size:13.5px", text: "هذه القوائم تظهر في نموذج إضافة الفستان وفي فلاتر البحث. حذف قيمة لا يغيّر الإعلانات القديمة التي تستخدمها." }),
      h("div", { class: "fields" }, [...FIELD_LABELS.map(([k, t]) => listCard(k, t)), colors]),
      h("div", { class: "savebar" }, [
        h("span", { style: "font-size:13.5px;color:" + (dirty ? "var(--gold)" : "var(--muted)"), text: dirty ? "عندك تغييرات غير محفوظة" : "كل التغييرات محفوظة" }),
        h("div", { class: "row-actions" }, [dirty ? h("button", { class: "btn", type: "button", text: "تراجع", onclick: loadFields }) : null, save])
      ])
    );
  }
  addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  // ---------- publish requests ----------
  // صاحبة الإعلان رفعت صوراً خاماً؛ هنا ننزّلها، نرفع النسخ المعدّلة، ثم ننشر أو نرفض
  const photoUrl = (id) => "/uploads/" + encodeURIComponent(id);
  const COLOR_HEX = {};
  function setRevCount(n) {
    const b = $("#revCount");
    b.textContent = fmt(n);
    b.hidden = !n;
  }
  async function compressFinal(file) {
    // نخفف الصور الكبيرة فقط، ونحافظ على جودة عالية لأنها الصورة المنشورة
    if (file.size < 2.5 * 1024 * 1024) return file;
    try {
      const bmp = await createImageBitmap(file);
      const s = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
      const c = document.createElement("canvas");
      c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      return (await new Promise((r) => c.toBlob(r, "image/jpeg", 0.9))) || file;
    } catch (e) { return file; }
  }
  async function uploadFinal(file) {
    const fd = new FormData();
    fd.append("photo", await compressFinal(file), "photo");
    const res = await fetch("/api/uploads", { method: "POST", body: fd, credentials: "same-origin" });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error(data.error || "upload"); e.code = data.error || (res.status === 413 ? "too_large" : "upload"); throw e; }
    return data.id;
  }
  function downloadAll(ids, title) {
    ids.forEach((id, i) => setTimeout(() => {
      const a = h("a", { href: photoUrl(id), download: "dolab-" + (title || "dress").replace(/\s+/g, "-") + "-" + (i + 1) + id.slice(id.lastIndexOf(".")) });
      document.body.append(a); a.click(); a.remove();
    }, i * 350));
  }
  async function loadReviews() {
    loading("#tab-reviews");
    let list;
    try { list = (await api("GET", "/api/admin/reviews")).reviews; } catch (e) { fail(e); return; }
    setRevCount(list.length);
    if (!list.length) {
      $("#tab-reviews").replaceChildren(h("div", { class: "card empty" }, [h("h2", { text: "ما في طلبات معلّقة 🎉" }), h("p", { class: "hint", text: "أي فستان جديد بتضيفه وحدة من المستخدمات بيظهر هون لتجهّز صوره وتنشره." })]));
      return;
    }
    $("#tab-reviews").replaceChildren(
      h("p", { class: "hint", style: "margin:0;color:var(--muted);font-size:13.5px", text: fmt(list.length) + " طلب بانتظار تجهيز الصور · الأقدم أولاً. نزّل الصور الأصلية، عدّلها، ارفع النسخ النهائية، ثم انشر." }),
      ...list.map(reviewCard)
    );
  }
  function reviewCard(d) {
    let finals = [];
    const box = h("div", { class: "rv" });
    const finalsGrid = h("div", { class: "rv-photos" });
    const publishBtn = h("button", { class: "btn primary", type: "button", text: "نشر الإعلان" });
    const fileInput = h("input", { type: "file", accept: "image/*", multiple: true, hidden: true });
    const finalsCount = h("span", { class: "hint num" });
    let busy = false;

    function drawFinals() {
      finalsCount.textContent = fmt(finals.length) + " / 4";
      finalsGrid.replaceChildren(...finals.map((id, i) => h("div", { class: "rv-ph" }, [
        h("img", { src: photoUrl(id), alt: "" }),
        i === 0 ? h("span", { class: "cover", text: "الغلاف" }) : null,
        h("button", { type: "button", text: "إزالة", onclick: () => { finals.splice(i, 1); drawFinals(); } })
      ])));
      if (finals.length < 4) {
        const drop = h("label", { class: "rv-drop" }, [h("span", { text: busy ? "جارٍ الرفع…" : "＋ ارفع الصور المعدّلة" })]);
        drop.addEventListener("click", () => fileInput.click());
        drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drag"); });
        drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
        drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("drag"); addFinals(e.dataTransfer.files); });
        finalsGrid.append(drop);
      }
      publishBtn.disabled = !finals.length || busy;
    }
    async function addFinals(files) {
      const list = Array.from(files || []).filter((f) => f.type.startsWith("image/")).slice(0, 4 - finals.length);
      if (!list.length) return;
      busy = true; drawFinals();
      try { for (const f of list) finals.push(await uploadFinal(f)); }
      catch (e) { toast(e.code === "too_large" ? "الصورة أكبر من 8MB" : e.code === "unsupported_type" ? "استخدم JPG أو PNG أو WEBP" : "تعذّر رفع الصورة"); }
      finally { busy = false; drawFinals(); }
    }
    fileInput.addEventListener("change", () => { addFinals(fileInput.files); fileInput.value = ""; });

    publishBtn.addEventListener("click", async () => {
      if (!finals.length) return;
      publishBtn.disabled = true;
      try {
        await api("POST", "/api/admin/dresses/" + encodeURIComponent(d.id) + "/approve", { photos: finals });
        toast("تم نشر \"" + d.title + "\" ✅");
        loaded.overview = false; loaded.dresses = false;
        loadReviews();
      } catch (e) { publishBtn.disabled = false; fail(e); }
    });
    const rejectBtn = h("button", { class: "btn danger", type: "button", text: "رفض مع ملاحظة", onclick: async () => {
      const note = prompt("سبب الرفض — رح يظهر لصاحبة الإعلان:", "الصور مش واضحة، ارفعي صور للفستان كامل بضوء النهار.");
      if (!note || !note.trim()) return;
      try {
        await api("POST", "/api/admin/dresses/" + encodeURIComponent(d.id) + "/reject", { note: note.trim() });
        toast("تم إرجاع الإعلان لصاحبته");
        loaded.dresses = false;
        loadReviews();
      } catch (e) { fail(e); }
    } });

    const rawGrid = h("div", { class: "rv-photos" }, d.rawPhotos.map((id, i) => h("div", { class: "rv-ph" }, [
      h("img", { src: photoUrl(id), alt: "", loading: "lazy" }),
      h("a", { href: photoUrl(id), download: "dolab-" + d.title.replace(/\s+/g, "-") + "-" + (i + 1) + id.slice(id.lastIndexOf(".")), text: "تنزيل" })
    ])));
    const price = [d.rent ? fmt(d.rent) + " ر.س / ليلة" : "", d.deposit ? "تأمين " + fmt(d.deposit) : "", d.sale ? "بيع " + fmt(d.sale) + " ر.س" : ""].filter(Boolean);
    const hex = d.colorHex || COLOR_HEX[d.color];

    drawFinals();
    box.append(...[
      h("div", { class: "rv-head" }, [
        h("div", null, [
          h("h2", { text: d.title }),
          h("div", { class: "rv-meta" }, [
            h("span", { text: d.ownerName }), h("span", { class: "u-mail", text: d.ownerEmail }),
            h("span", { text: "أُرسل " + ago(d.submittedAt) }),
            d.wasPublished ? h("span", { class: "badge gold", text: "تعديل صور لإعلان منشور" }) : h("span", { class: "badge ok", text: "إعلان جديد" })
          ])
        ])
      ]),
      h("div", { class: "rv-facts" }, [
        h("span", { text: MODES[d.mode] }), ...price.map((p) => h("span", { class: "num", text: p })),
        h("span", { text: d.size }), h("span", { text: d.occasion }), h("span", { text: d.condition }), h("span", { text: d.city }),
        h("span", null, [hex ? h("i", { style: "background:" + hex }) : null, d.color + (d.colorHex ? " · " + d.colorHex : "")]),
        d.phone ? h("span", { class: "num", style: "direction:ltr", text: d.phone }) : null
      ]),
      d.desc ? h("p", { class: "rv-desc", text: d.desc }) : null,
      h("div", { class: "rv-cols" }, [
        h("div", { class: "rv-box" }, [
          h("h3", null, ["١ · الصور الأصلية من صاحبة الإعلان", h("button", { class: "linkbtn", type: "button", text: "تنزيل الكل", onclick: () => downloadAll(d.rawPhotos, d.title) })]),
          rawGrid
        ]),
        h("div", { class: "rv-box" }, [
          h("h3", null, ["٢ · الصور النهائية للنشر", finalsCount]),
          finalsGrid, fileInput,
          h("div", { style: "display:flex;flex-wrap:wrap;gap:12px" }, [
            h("button", { class: "linkbtn", type: "button", text: "استخدم الصور الأصلية كما هي", onclick: () => { finals = d.rawPhotos.slice(0, 4); drawFinals(); } }),
            d.photos.length ? h("button", { class: "linkbtn", type: "button", text: "أبقِ الصور المنشورة حالياً", onclick: () => { finals = d.photos.slice(0, 4); drawFinals(); } }) : null
          ])
        ])
      ]),
      h("div", { class: "rv-actions" }, [rejectBtn, h("div", { class: "grp" }, [publishBtn])])
    ].filter(Boolean));
    return box;
  }

  const LOADERS = { overview: loadOverview, reviews: loadReviews, users: loadUsers, dresses: loadDressesTab, fields: loadFields };

  // ---------- boot ----------
  (async function boot() {
    let me = null;
    try { me = (await api("GET", "/api/auth/me")).user; } catch (e) {}
    if (!me) return showGate("لوحة التحكم", "سجّل الدخول من الموقع بحساب المشرف أولاً، ثم ارجع لهذه الصفحة.");
    if (!me.isAdmin) return showGate("غير مصرّح", "هذه الصفحة للمشرف فقط.");
    $("#who").textContent = me.name;
    $("#refreshBtn").hidden = false;
    $("#main").hidden = false;
    // ألوان القائمة لعرض دائرة اللون في الطلبات، وعدد الطلبات المعلّقة على التبويب
    try { for (const c of (await api("GET", "/api/catalog")).catalog.colors) COLOR_HEX[c.name] = c.hex; } catch (e) {}
    try { const r = await api("GET", "/api/admin/reviews"); setRevCount(r.reviews.length); showTab(r.reviews.length ? "reviews" : "overview"); }
    catch (e) { showTab("overview"); }
  })();
})();
</script>
</body>
</html>
